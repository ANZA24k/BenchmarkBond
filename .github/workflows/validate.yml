name: Validate BenchmarkBond
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official GenVM linter
        run: pip install genvm-linter
      - name: Check GenVM contract and SDK
        run: genvm-lint check contracts/benchmarkbond.py
      - name: Execute isolated contract tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python source
        run: python -m py_compile contracts/benchmarkbond.py
